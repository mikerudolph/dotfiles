# A compact macOS prompt using the Tokyo Night Night palette.
palette = "tokyo_night"
scan_timeout = 20
command_timeout = 500
add_newline = false
format = "$directory$git_branch$git_status$aws$cmd_duration$line_break$character"

[directory]
style = "bold blue"
truncation_length = 2
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
format = " on [$symbol$branch]($style)"
symbol = " "
style = "magenta"

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "yellow"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = '\$${count}'
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[aws]
symbol = "☁ "
format = " via [$symbol$profile(:$region)]($style)"
style = "bold yellow"
disabled = false

[cmd_duration]
min_time = 1000
format = " took [$duration](bold yellow)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold cyan)"

[palettes.tokyo_night]
background = "#1a1b26"
foreground = "#c0caf5"
comment = "#565f89"
red = "#f7768e"
orange = "#ff9e64"
yellow = "#e0af68"
green = "#9ece6a"
cyan = "#7dcfff"
blue = "#7aa2f7"
magenta = "#bb9af7"
